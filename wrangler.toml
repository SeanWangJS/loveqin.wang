# ==============================================================================
# Cloudflare Pages / Workers 生产部署配置 (Production - 默认顶级环境)
# ==============================================================================
name = "loveqin-gallery"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"
CF_ACCESS_TEAM_DOMAIN = "loveqin"

# Cloudflare D1 边缘数据库配置 (生产环境)
[[d1_databases]]
binding = "DB"
database_name = "gallery-d1"
database_id = "4610848e-16dd-4bae-901b-6a429f08d101" # 生产 D1 数据库 UUID
migrations_dir = "./drizzle/migrations"

# Cloudflare R2 私有媒体存储桶配置 (生产环境)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gallery-media-private"

# ==============================================================================
# 预发与 PR 预览环境配置 (Preview / Staging)
# ==============================================================================
[env.preview]
[env.preview.vars]
ENVIRONMENT = "preview"
CF_ACCESS_TEAM_DOMAIN = "loveqin"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "gallery-d1-preview"
database_id = "a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d" # 预览 D1 数据库 UUID
migrations_dir = "./drizzle/migrations"

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "gallery-media-preview"
# Local development is handled by Vite and the local SQLite/object-store middleware.
